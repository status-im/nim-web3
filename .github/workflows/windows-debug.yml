name: windows-debug

on:
  push:
    branches:
      - UFu
  workflow_dispatch:

permissions:
  contents: read

env:
  NIMBLE_COMMIT: '42ef70c2102a942c46f13eb76872326edd525cec' # v0.22.3, same as common workflow default

jobs:
  debug:
    strategy:
      fail-fast: false
      matrix:
        branch: [version-2-2, version-2-4, devel]
    name: 'windows-debug (Nim ${{ matrix.branch }})'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      # Identical cache keys to nimbus-common-workflow so we restore the exact
      # same llvm-mingw / DLLs / built-Nim binaries the failing CI jobs used.
      - name: Restore llvm-mingw (Windows) from cache
        id: windows-mingw-cache
        uses: actions/cache@v6
        with:
          path: external/mingw-amd64
          key: 'mingw-llvm-17-amd64'

      - name: Install llvm-mingw dependency (Windows)
        if: steps.windows-mingw-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p external
          MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/20241203/llvm-mingw-20241203-ucrt-x86_64.zip"
          curl -L "$MINGW_URL" -o "external/mingw-amd64.zip"
          7z x -y "external/mingw-amd64.zip" -oexternal/mingw-amd64/
          mv external/mingw-amd64/**/* ./external/mingw-amd64

      - name: Restore Nim DLLs dependencies (Windows) from cache
        id: windows-dlls-cache
        uses: actions/cache@v6
        with:
          path: external/dlls-amd64
          key: 'dlls-amd64'

      - name: Install DLLs dependencies (Windows)
        if: steps.windows-dlls-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p external
          curl -L "https://nim-lang.org/download/windeps.zip" -o external/windeps.zip
          7z x -y external/windeps.zip -oexternal/dlls-amd64

      - name: Path to cached dependencies (Windows)
        run: |
          echo "${{ github.workspace }}/external/mingw-amd64/bin" >> $GITHUB_PATH
          echo "${{ github.workspace }}/external/dlls-amd64" >> $GITHUB_PATH

      - name: Get Nim commit hash
        id: nim-hash
        uses: actions/github-script@v9
        with:
          script: |
            const branch = "${{ matrix.branch }}";
            const res = await github.rest.repos.getBranch({
              owner: "nim-lang",
              repo: "Nim",
              branch: branch,
            });
            const sha = res.data.commit.sha;
            core.setOutput("nim_commit_hash", sha);
            core.exportVariable("NIM_COMMIT_HASH", sha);

      - name: Restore Nim build from cache
        id: nim-cache
        uses: actions/cache@v6
        with:
          path: |
            nim/bin
            nim/config
            nim/lib
            nim/nim.nimble
          key: nim-${{ matrix.branch }}-${{ steps.nim-hash.outputs.nim_commit_hash }}-windows-amd64-${{ env.NIMBLE_COMMIT }}

      - name: Build Nim and Nimble
        if: steps.nim-cache.outputs.cache-hit != 'true'
        env:
          MAKE: make -j4
          ARCH_OVERRIDE: x64
          NIM_COMMIT: ${{ matrix.branch }}
          QUICK_AND_DIRTY_COMPILER: 1
          QUICK_AND_DIRTY_NIMBLE: 1
          CC: gcc
        run: |
          curl -O -L -s -S https://raw.githubusercontent.com/status-im/nimbus-build-system/master/scripts/build_nim.sh
          bash build_nim.sh nim csources dist/nimble NimBinaries

      - name: Add Nim bin to GITHUB_PATH
        run: echo '${{ github.workspace }}/nim/bin' >> $GITHUB_PATH

      - name: Build test binary
        run: |
          nim --version
          nimble --version
          gcc --version
          nimble --useSystemNim install -y --depsOnly
          # exact invocation from the failing nimble test task, minus -r
          nim c --mm:refc --outdir:build --skipParentCfg --nimcache:nimcache_debug tests/all_tests.nim

      - name: Run test binary (capture real exit code)
        if: always()
        shell: pwsh
        continue-on-error: true
        run: |
          .\build\all_tests.exe
          $ec = $LASTEXITCODE
          "exit code (dec): $ec"
          "exit code (hex): 0x{0:X8}" -f ([uint32]$ec)

      - name: Upload binary and nimcache
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all_tests-${{ matrix.branch }}
          path: |
            build/all_tests.exe
            nimcache_debug
          if-no-files-found: warn
